{% extends "base.html" %}
{% block title %}เกิดข้อผิดพลาด ({{ error_code }}){% endblock %}
{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4">
    <div class="w-20 h-20 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mb-6 shadow-inner">
        <i data-lucide="alert-triangle" class="w-10 h-10"></i>
    </div>
    <h1 class="text-6xl font-extrabold text-slate-800 tracking-tight mb-2">{{ error_code }}</h1>
    <h2 class="text-2xl font-bold text-slate-700 mb-3">{{ error_message }}</h2>
    <p class="text-slate-500 max-w-md mb-8">
        ระบบตรวจพบความผิดปกติและได้ดักจับข้อผิดพลาดเรียบร้อยแล้ว ไม่พบปัญหาข้อมูลสูญหาย
    </p>
    <a href="{{ url_for('tables') }}" class="inline-flex items-center space-x-2 bg-slate-900 hover:bg-slate-800 text-white font-medium px-6 py-3 rounded-xl shadow-lg transition">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>กลับสู่หน้าหลัก</span>
    </a>
</div>
{% endblock %}
