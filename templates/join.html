{% extends "base.html" %}
{% block title %}เข้าร่วมโต๊ะ - KITCHEN OS{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-6 px-4">
    <div class="max-w-md w-full">
        <div class="glass-hero rounded-3xl p-8 space-y-6 shadow-2xl border border-white/10">

            <div class="text-center space-y-2">
                <div class="inline-flex p-3 rounded-2xl bg-blue-500/10 border border-blue-500/30 text-blue-300">
                    <i data-lucide="ticket" class="w-7 h-7"></i>
                </div>
                <h2 class="text-2xl font-black text-white font-heading tracking-tight">เข้าร่วมโต๊ะ</h2>
                <p class="text-slate-400 text-xs">กรอกรหัสเชิญที่เพื่อนแชร์ให้คุณ</p>
            </div>

            <form action="{{ url_for('join_table') }}" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2 font-mono">รหัสเชิญ (INVITE CODE)</label>
                    <input type="text" name="invite_code" required maxlength="6" minlength="6"
                        placeholder="เช่น ABC123"
                        pattern="[A-Fa-f0-9]{6}"
                        title="รหัสเชิญ 6 ตัวอักษร (A-F, 0-9)"
                        autocomplete="off"
                        style="text-transform: uppercase; letter-spacing: 0.3em; text-align: center; font-size: 24px; font-weight: 900;"
                        class="w-full px-4 py-5 bg-slate-900 border border-white/10 rounded-2xl text-white font-mono placeholder-slate-600 placeholder:font-normal placeholder:tracking-normal placeholder:text-base placeholder:text-center focus:outline-none focus:border-blue-500">
                </div>

                <button type="submit"
                    class="w-full py-3.5 px-4 bg-blue-500 hover:bg-blue-400 text-white font-black rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    <span>เข้าร่วมโต๊ะ</span>
                </button>
            </form>

            <div class="pt-4 border-t border-white/10 flex items-center justify-between text-xs">
                <a href="{{ url_for('select_table') }}" class="text-slate-400 hover:text-white transition">
                    ← เลือกโต๊ะเอง
                </a>
                <a href="{{ url_for('my_table') }}" class="text-[#57ffa8] font-bold hover:underline">
                    ดูโต๊ะของฉัน →
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
