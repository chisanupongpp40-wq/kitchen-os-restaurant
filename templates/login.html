{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ - KITCHEN OS{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-6 px-4">
    <div class="max-w-md w-full">
        <div class="glass-hero rounded-3xl p-8 space-y-6 shadow-2xl relative overflow-hidden border border-white/10">

            <!-- Header -->
            <div class="text-center space-y-2">
                <div class="inline-flex p-3 rounded-2xl bg-[#57ffa8]/10 border border-[#57ffa8]/30 text-[#57ffa8]">
                    <i data-lucide="sparkles" class="w-7 h-7"></i>
                </div>
                <h2 class="text-2xl font-black text-white font-heading tracking-tight">เข้าสู่ระบบ KITCHEN OS</h2>
                <p class="text-slate-400 text-xs font-mono">Restaurant Management System</p>
            </div>

            <!-- ฟอร์ม Login -->
            <form action="{{ url_for('login') }}" method="POST" class="space-y-4" autocomplete="on">
                <div>
                    <label for="loginUsername" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2 font-mono">
                        USERNAME
                    </label>
                    <div class="relative">
                        <i data-lucide="user" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="text" id="loginUsername" name="username" value="{{ username or '' }}"
                            required autofocus maxlength="50" autocomplete="username"
                            placeholder="กรอกชื่อผู้ใช้"
                            class="w-full pl-11 pr-4 py-3 bg-slate-900 border border-white/10 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#57ffa8] transition">
                    </div>
                </div>

                <div>
                    <label for="loginPassword" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2 font-mono">
                        PASSWORD
                    </label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="password" id="loginPassword" name="password"
                            required maxlength="100" autocomplete="current-password"
                            placeholder="กรอกรหัสผ่าน"
                            class="w-full pl-11 pr-11 py-3 bg-slate-900 border border-white/10 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#57ffa8] transition">
                        <button type="button" onclick="togglePassword()"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition"
                            title="แสดง/ซ่อนรหัสผ่าน">
                            <i data-lucide="eye" id="toggleEye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <button type="submit"
                    class="w-full py-3.5 px-4 bg-[#57ffa8] hover:bg-[#46e696] text-slate-950 font-black rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    <span>เข้าสู่ระบบ</span>
                </button>
            </form>

            <!-- ลิงก์สมัครสมาชิก -->
            <div class="pt-4 border-t border-white/10 text-center">
                <p class="text-xs text-slate-400">
                    ยังไม่มีบัญชี?
                    <a href="{{ url_for('register') }}" class="text-[#57ffa8] font-bold hover:underline ml-1">
                        สมัครสมาชิกใหม่ →
                    </a>
                </p>
            </div>

        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function togglePassword() {
        const passwordInput = document.getElementById('loginPassword');
        const eyeIcon = document.getElementById('toggleEye');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.setAttribute('data-lucide', 'eye-off');
        } else {
            passwordInput.type = 'password';
            eyeIcon.setAttribute('data-lucide', 'eye');
        }
        lucide.createIcons();
    }
</script>
{% endblock %}
